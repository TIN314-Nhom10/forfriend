services:
  - type: web
    name: forfriend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./forfriend.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: LIVEKIT_API_KEY
        value: devkey
      - key: LIVEKIT_API_SECRET
        value: secret
      - key: LIVEKIT_URL
        value: wss://forfriend-demo.livekit.cloud
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
