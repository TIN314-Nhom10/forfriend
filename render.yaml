services:
  - type: web
    name: forfriend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./forfriend.db
      - key: JWT_SECRET_KEY
        value: forfriend_course_project_jwt_secret_key_2026_super_secure
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
